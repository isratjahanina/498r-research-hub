<script type="application/json" id="app-data">{"ideas":[{"id":"I1","rq":"RQ1","status":"Literature review","title":"How much do pipelines rely on category names versus support images?","problem":"Several pipelines take a category name and a support image. Their reported scores do not show how much each input contributes. VLM-Guided uses no support images at all and still reports 65.27 bbox mAP (its Table 1).","why":"This is our central research question: do the pipelines use few-shot visual evidence, or mainly pretrained semantic knowledge?","papers":["Few-Shot Semantic Segmentation Meets SAM3","Beyond Mask: Rethinking Guidance Types in Few-shot Segmentation (arXiv:2407.11503)","Beyond Visual Cues: Leveraging General Semantics as Support for Few-Shot Segmentation (arXiv:2511.16435)","LLaFS: When Large Language Models Meet Few-Shot Segmentation (arXiv:2311.16926)","Training-Free Few-Shot Segmentation via Vision-Language Guided Prompting: name, support and detector score are averaged","No Time to Train! Training-Free Reference-Based Instance Segmentation: visual only, one of two extremes","VLM-Guided Detection and Rematching for Private Object Localization: semantic only, the other extreme"],"prevExp":["Few-Shot Semantic Segmentation Meets SAM3, Table 5: text-only 74.9, visual-only 66.6, both 75.8 mIoU on COCO-20i; 81.0, 79.6, 81.2 on PASCAL-5i, with ground-truth class names.","Beyond Visual Cues (arXiv:2511.16435): removing the support changed mIoU by -0.7 (VOC) and +0.9 (COCO) in a trained model. Not verified: we have not read this paper in full.","LLaFS (arXiv:2311.16926): removing the support changed mIoU by -17.3 in a trained model. Not verified: we have not read this paper in full.","UniFSS, \"Beyond Mask\" (arXiv:2407.11503): class text gave +8.2% relative mIoU in 1-shot and no gain on FSS-1000, in a trained model. Not verified: we have not read this paper in full.","VLM-Guided Detection and Rematching, Table 1: combining its two prompt components adds +8.93 bbox mAP over its own baseline row (56.34 to 65.27). The paper uses no support images, so there is no support arm."],"prevMetrics":"mIoU on few-shot segmentation benchmarks; bbox and segmentation mAP on BIV-Priv-Seg for VLM-Guided and Agent2Seg.","established":["In general-domain tests with correct names, text can be as strong as or stronger than a single visual example (SAM3-FSS).","Support contribution in trained models ranges from small to large depending on the model and dataset.","The effect is not stable across papers, so it cannot be assumed for private categories."],"uncertain":["Whether the same holds for private categories (documents, cards) (not reported).","Whether training-free multi-model pipelines use the support or ignore it (not reported).","Behaviour with wrong or misleading names: Table 6 of Few-Shot Semantic Segmentation Meets SAM3 changes the pool of candidate names, not the correctness of the name.","A recent paper (arXiv:2511.18163) studies attribution to support pixels. Only its abstract was seen, so its overlap with RQ1 and RQ2 is not verified."],"approach":"For each compatible pipeline, run input conditions: original, support without name, name without support, both, and a wrong name. Report benefit from correct input and harm from wrong input separately. Only run conditions the architecture accepts: NTT has no name input, VLM-Guided has no support input.","evaluation":"Primary: box and mask AP/mAP and AP50 (metric names as given on the VizWiz object-localization task page; not re-checked); per-category results; bootstrap confidence intervals over images. Secondary: target-selection accuracy in the oracle crop diagnostic. Output change alone is not a quality measure.","outcomes":["Large drop when the name is removed and little when the support is removed: suggests heavy reliance on semantic knowledge for that pipeline (does not prove the support is useless).","Little change under either removal: the pipeline may be saturated, the intervention weak, or the input ignored; a follow-up is needed before choosing an explanation.","Support-only works well and the name adds little: visual evidence is carrying the decision."],"risks":["Closest work (SAM3-FSS, UniFSS, LLaFS, 2511.16435, 2511.18163) already covers the concept; our difference would be the private domain and pipeline family only.","Official support set has one image per category; per-category evidence rests on one photo.","Agent2Seg cannot be reproduced exactly (LoRA weights unreleased, paid API).","Images not yet downloaded; hardware unverified."],"ideaText":"Retain, remove or corrupt the name and the support, for each pipeline that accepts that input, and measure the change.","gapNote":"No found study separates name and support contribution in training-free private-object pipelines.","implNotes":"","plans":[{"id":"X1","name":"Name x support input ablation","method":["For each pipeline, run only the input states it accepts: original, support without name, name without support, both.","Keep candidate generation settings, thresholds and prompts fixed; log every setting.","Run the same query images in every condition (paired comparison).","Report per category."],"models":"Pipelines that accept the needed inputs. The core set is not decided; candidates are NTT, VLGP and SAM3-FSS, and VLM-Guided and Agent2Seg are possible but may be hard to reproduce.","data":"BIV-Priv-Seg release (16 supports, 1,056 query images, 916 annotated instances, 196 images with no annotated instance) (counted by us in the downloaded dataset files). Images are not downloaded yet. Split into design and held-out halves by image, rule to be written before any result. Sample selection rule: not yet defined.","hypothesis":"Hypothesis (not a result): pipelines that take a name will lose more when the name is removed than when the support is removed, as in SAM3-FSS Table 5 on general data. This may not hold for private categories.","metrics":"Box and mask AP/mAP and AP50 (official names); per-category AP; bootstrap confidence intervals over images; benefit from correct input and harm from wrong input reported separately.","limitations":"Not a test of internal reasoning. One support per category. Unsupported cells are marked not applicable, not filled. Official scoring of empty images unknown."},{"id":"X2","name":"Oracle crop-level matching diagnostic (not end-to-end)","method":["Give the true mask crop of each query object.","Ask which of the 16 supports (or names) it matches.","Compare chance (6.25%), majority class, text-only, whole-crop vector, mask-averaged patches, grid-pooled patches, text plus visual.","Choose settings on the design half, report on the held-out half."],"models":"Frozen feature extractors and text encoders (for example DINOv2, CLIP); exact set not decided.","data":"BIV-Priv-Seg release (16 supports, 1,056 query images, 916 annotated instances, 196 images with no annotated instance) (counted by us in the downloaded dataset files). Images are not downloaded yet. Split into design and held-out halves by image, rule to be written before any result. Sample selection rule: not yet defined. Uses query labels: analysis only.","hypothesis":"Hypothesis: whole-crop vectors will confuse look-alike categories more than mask-averaged or part-pooled descriptions. Untested.","metrics":"Top-1 and macro-averaged accuracy, confusion matrix, bootstrap intervals.","limitations":"Does not test proposals, SAM masks, empty images, official AP or VLM verifiers. No leaderboard comparison. Blocked: query images not downloaded."}],"prevImpl":[{"id":"ntt","short":"NTT","method":"Frozen DINOv2-L builds one prototype per category from mask-averaged reference features. SAM2-L produces candidate masks from a 32x32 point grid. Cosine similarity picks matches; semantic-aware soft merging, NMS and top-K give the output.","tf":"The paper presents the method as training-free (abstract). Its code was not inspected: not verified."},{"id":"vlgp","short":"VLGP","method":"OWL-ViT proposes boxes from \"a photo of a {class}\". CLIP with LEVE (local re-weighting) scores each box on support similarity, text similarity and OWL-ViT score (mean of three, Eq. 6). Boxes above mean + 0.3 x std are kept. SAM ViT-H makes masks and self-refines; a CLIP text filter (0.2) removes masks; masks are merged.","tf":"The paper presents the method as training-free (abstract). Its hyperparameter choices: not verified."},{"id":"sam3fss","short":"SAM3-FSS","method":"The support instance becomes a box prompt. Support and query are stacked on one 1008x1008 canvas; frozen SAM3 attends across both. An optional class name enters the decoder. One forward pass returns query masks with confidence.","tf":"The paper presents the method as training-free (abstract: a fully frozen SAM3). Its layout choice: not verified."},{"id":"vlmg","short":"VLM-Guided","method":"Qwen3-VL-8B writes detector prompts and picks a supercategory; Grounding DINO proposes boxes; the same VLM accepts or rejects each box and assigns a category; SAM makes masks.","tf":"The paper states no model fine-tuning (abstract). Its code repository was not inspected: not verified."},{"id":"a2s","short":"Agent2Seg","method":"Optional restoration; SAM3 (LoRA-adapted) prompted with all category names gives one candidate per category; image similarity, text similarity and OCR provide evidence; a tri-state classifier (yes / no / insufficient) and a selector choose the output or an empty object.","tf":"Not training-free as described: the paper text says SAM3 is LoRA-adapted. Whether it needs a paid API or an unreleased adapter: not verified (code repository not inspected)."}]},{"id":"I2","rq":"RQ2","status":"Under consideration","title":"Can the support image resolve ambiguous or misleading labels?","problem":"If a label is wrong or too general, a correct support image might still lead to the right object. Whether pipelines achieve that is untested on private categories.","why":"RQ2 asks whether visual evidence resolves ambiguity. If it does not, the \"few-shot visual evidence\" claim is weakened.","papers":["Few-Shot Semantic Segmentation Meets SAM3: name pool (Table 6) and negative prompts","No Time to Train! Training-Free Reference-Based Instance Segmentation: reference variance and size, similar-class confusion (Appendix A.1, A.5, A.9)","Beyond Mask: Rethinking Guidance Types in Few-shot Segmentation (arXiv:2407.11503): scale-mismatch failure case","Matching-Based Few-Shot Semantic Segmentation Models Are Interpretable by Design (arXiv:2511.18163): attribution to support pixels (abstract only)","Support-dilution and meta-class memory papers (trained, multi-shot): titles not recorded; not verified"],"prevExp":["Few-Shot Semantic Segmentation Meets SAM3, Table 6: choosing the name from a dataset-level candidate list instead of using the ground-truth name lowers COCO-20i mIoU from 75.8 to 67.8 (PASCAL-5i: 81.2 to 79.1).","No Time to Train!: larger reference masks score higher on COCO (its Figure 11 plots reference-image performance against mask area; trend not independently checked). Similar classes overlap in DINOv2 feature space according to its feature-separability analysis (Appendix A.5; not independently checked).","Trained methods prune or weight supports by quality (arXiv:2501.13529 and arXiv:2108.02958). Not verified: only abstracts were seen and we have not read the papers."],"prevMetrics":"mIoU or nAP on general benchmarks; qualitative failure images (NTT).","established":["Name noise can hurt (SAM3-FSS Table 6).","Support size and choice affect results in general-domain tests (NTT).","Similar classes are confused by feature matching (NTT)."],"uncertain":["Whether a correct support repairs a wrong name (not reported).","Whether wrong-category and look-alike supports mislead the pipelines (not reported).","Whether the 16 private categories show the same confusion as COCO classes (hypothesis).","Whether pipelines react to support changes in a correct way or merely react (not verified)."],"approach":"Use the conflict cells of the name-by-support grid: wrong name with correct support, correct name with wrong-category support, and look-alike supports chosen by a rule written before looking at results. Include pairs of visually similar categories as an ambiguity test.","evaluation":"Benefit from correct support when the name is wrong; harm from wrong support when the name is right; reported separately, with per-category results and intervals. Pair output change with accuracy so that sensitivity is not read as grounding.","outcomes":["Correct support restores performance under a wrong name: visual evidence can resolve ambiguity for that pipeline.","Performance follows the name regardless of the support: semantic evidence dominates; wrong-name cells are stress tests, not normal use.","Wrong support does not hurt: support ignored, intervention weak, or the semantic prior dominates; design a follow-up before choosing."],"risks":["Only 15 other supports exist for wrong-support cells; look-alike selection must be fixed in advance.","Wrong-name results are stress tests and must not be mixed into headline numbers.","Related interpretability work may already cover part of the question."],"ideaText":"Pair correct, wrong and look-alike supports with correct, wrong and ambiguous names, and compare.","gapNote":"Nobody found tested whether a correct support repairs a wrong or misleading name in training-free pipelines.","implNotes":"","plans":[{"id":"X3","name":"Misleading-label and conflicting-support test","method":["Define, before running, the wrong-name and look-alike pairs (for example condom box and condom with plastic bag).","Run name wrong with support correct; name correct with support wrong-category; name correct with support look-alike.","Compare with the baseline from X1 on the same images."],"models":"Pipelines that accept the needed inputs. The core set is not decided; candidates are NTT, VLGP and SAM3-FSS, and VLM-Guided and Agent2Seg are possible but may be hard to reproduce.","data":"BIV-Priv-Seg release (16 supports, 1,056 query images, 916 annotated instances, 196 images with no annotated instance) (counted by us in the downloaded dataset files). Images are not downloaded yet. Split into design and held-out halves by image, rule to be written before any result. Sample selection rule: not yet defined.","hypothesis":"Hypothesis: pipelines with explicit support similarity will recover partly; those driven by the name will follow the wrong name. Untested.","metrics":"Benefit and harm in AP and in selection accuracy, per category with intervals.","limitations":"Only 15 alternative supports per category. Selection of look-alikes must not follow results. Not a test of normal use."}],"prevImpl":[{"id":"ntt","short":"NTT","method":"Frozen DINOv2-L builds one prototype per category from mask-averaged reference features. SAM2-L produces candidate masks from a 32x32 point grid. Cosine similarity picks matches; semantic-aware soft merging, NMS and top-K give the output.","tf":"The paper presents the method as training-free (abstract). Its code was not inspected: not verified."},{"id":"vlgp","short":"VLGP","method":"OWL-ViT proposes boxes from \"a photo of a {class}\". CLIP with LEVE (local re-weighting) scores each box on support similarity, text similarity and OWL-ViT score (mean of three, Eq. 6). Boxes above mean + 0.3 x std are kept. SAM ViT-H makes masks and self-refines; a CLIP text filter (0.2) removes masks; masks are merged.","tf":"The paper presents the method as training-free (abstract). Its hyperparameter choices: not verified."},{"id":"sam3fss","short":"SAM3-FSS","method":"The support instance becomes a box prompt. Support and query are stacked on one 1008x1008 canvas; frozen SAM3 attends across both. An optional class name enters the decoder. One forward pass returns query masks with confidence.","tf":"The paper presents the method as training-free (abstract: a fully frozen SAM3). Its layout choice: not verified."}]},{"id":"I3","rq":"RQ3","status":"Under consideration","title":"Can VLM-based verification separate true targets from look-alike distractors?","problem":"The two private-object papers rely on a VLM verifier, but candidate generation and verification always change together, so verifier quality is unknown.","why":"RQ3 asks how well VLM verification distinguishes targets from distractors; a fair test needs the same candidates for every verifier.","papers":["VLM-Guided Detection and Rematching for Private Object Localization","Agent2Seg: Agentic VLM-Guided Few-Shot Object Localization and Segmentation for Accessibility-Oriented Images","Training-Free Few-Shot Segmentation via Vision-Language Guided Prompting: filter on boxes and masks","MultiPriv: Benchmarking Individual-Level Privacy Reasoning in Vision-Language Models: related work, not a segmentation method; reports refusal rates of commercial VLMs on privacy tasks (Section 4.3, Table 6)","No Time to Train! Training-Free Reference-Based Instance Segmentation: similar-class confusion; Qwen2.5-VL + SAM2 comparison (Table 6)","Fantastic Tractor-Dogs and How Not to Find Them With Open-Vocabulary Detectors (abstract only; full title not verified)"],"prevExp":["VLM-Guided Detection and Rematching, Table 1: only the prompt content is ablated (56.34 to 65.27 bbox mAP); no row removes the rematching phase.","Agent2Seg: the paper reports no ablation; its classifier and selector are never removed (its only results table compares with other challenge entries).","Training-Free Few-Shot Segmentation via Vision-Language Guided Prompting (VLGP), Table 4: mIoU rises from 54.6 / 76.6 in row (a) to 67.8 / 81.9 in row (c) (COCO-20i / PASCAL-5i) as components are added. Which components each row switches on: not verified.","No Time to Train!, Table 6: a Qwen2.5-VL plus SAM 2 pipeline gets 6.2 nAP, while the paper's own pipeline reports 36.8 nAP in its abstract; other differences between the two confound the comparison."],"prevMetrics":"bbox and segmentation mAP (VLM-Guided, Agent2Seg); mIoU (VLGP); nAP (NTT).","established":["Filtering candidates helps in VLGP's setup.","Both private-object papers report strong scores with a VLM stage, but without separating it.","Similar classes confuse feature-matching pipelines (NTT)."],"uncertain":["How accurate each verifier is on a fixed candidate set (not reported).","Whether the VLM is independent: in VLM-Guided Detection and Rematching the same Qwen3-VL-8B model writes the detector cues and judges the boxes.","Effect of candidate order and presentation (not reported).","Whether Agent2Seg can be reproduced: its VLM classifier may need a paid API and an unreleased adapter. Not verified (its code repository was not inspected)."],"approach":"Build one candidate set per query (annotated target when present, plus hard negatives defined before the run). Present identical candidates to each verifier with controlled order. Compare accept/reject decisions.","evaluation":"Target-selection accuracy, false acceptance and false rejection on hard negatives, effect of order; per-category with intervals. This measures verifier decisions, not internal reasoning.","outcomes":["High false acceptance on look-alikes: the verifier is a weak distractor filter.","Accuracy depends on candidate order: the verifier is unstable and results need order controls.","High accuracy on fixed candidates but low end-to-end scores: candidate generation is the bottleneck (see I4)."],"risks":["Building honest hard negatives needs images and a written rule.","Closed or paid VLMs reduce reproducibility.","Needs candidate sets that do not favour one verifier."],"ideaText":"Give every verifier the same frozen candidate set with true targets and hard negatives.","gapNote":"Verifier quality is always mixed with candidate quality.","implNotes":"","plans":[{"id":"X5","name":"Fixed-candidate verifier audit","method":["Build and freeze one candidate set per query: the annotated target when present plus pre-defined look-alike distractors.","Run every verifier on exactly the same regions.","Randomise or control order and presentation.","Record accept or reject and the category."],"models":"Verifiers with open weights where possible (for example Qwen3-VL-8B if it runs); paid APIs only with approval.","data":"BIV-Priv-Seg release (16 supports, 1,056 query images, 916 annotated instances, 196 images with no annotated instance) (counted by us in the downloaded dataset files). Images are not downloaded yet. Split into design and held-out halves by image, rule to be written before any result. Sample selection rule: not yet defined.","hypothesis":"Hypothesis: verifiers will accept some look-alike distractors; accuracy may depend on candidate order. Untested.","metrics":"Target-selection accuracy, false acceptance and false rejection on hard negatives, order effect; per category with intervals.","limitations":"Does not test candidate generation. Hard negatives must be built honestly. Whether Qwen3-VL-8B fits the available GPU is unverified."}],"prevImpl":[{"id":"vlmg","short":"VLM-Guided","method":"Qwen3-VL-8B writes detector prompts and picks a supercategory; Grounding DINO proposes boxes; the same VLM accepts or rejects each box and assigns a category; SAM makes masks.","tf":"The paper states no model fine-tuning (abstract). Its code repository was not inspected: not verified."},{"id":"a2s","short":"Agent2Seg","method":"Optional restoration; SAM3 (LoRA-adapted) prompted with all category names gives one candidate per category; image similarity, text similarity and OCR provide evidence; a tri-state classifier (yes / no / insufficient) and a selector choose the output or an empty object.","tf":"Not training-free as described: the paper text says SAM3 is LoRA-adapted. Whether it needs a paid API or an unreleased adapter: not verified (code repository not inspected)."}]},{"id":"I4","rq":"RQ4","status":"Under consideration","title":"At which stage do pipelines fail: candidates, correspondence, classification or segmentation?","problem":"A low score does not say which stage failed. Papers report scores, not stage-wise error shares.","why":"RQ4 asks where failures occur. Knowing it directs effort to the stage with real headroom.","papers":["No Time to Train! Training-Free Reference-Based Instance Segmentation: encoder and SAM2 size sensitivity (Table 4)","Training-Free Few-Shot Segmentation via Vision-Language Guided Prompting: component additions (Table 4)","Agent2Seg: Agentic VLM-Guided Few-Shot Object Localization and Segmentation for Accessibility-Oriented Images: future work on candidate recall","Matcher: Segment Anything with One Shot Using All-Purpose Feature Matching (arXiv:2305.13310): DINOv2 + SAM matching"],"prevExp":["No Time to Train!, Table 4: DINOv2-ViT-L-14 gives 35.7 nAP against 15.2 to 19.2 for the CLIP backbones (10-shot, bounding box). The effect of SAM2 size: not verified.","VLGP, Table 4: from row (d) to row (e) mIoU rises by 1.3 (COCO-20i) and 1.0 (PASCAL-5i); row (f), which uses MobileSAM, is 4.5 and 7.8 lower than row (e).","No paper among those we read reports candidate recall or oracle-box segmentation (our reading, not a literature-wide claim)."],"prevMetrics":"End-to-end mIoU, nAP or mAP.","established":["Feature quality and candidate filtering matter in general-domain tests.","Mask-model size changes results (NTT, VLGP).","Whether a stage is the main source of error on private categories is not shown by any paper."],"uncertain":["Candidate recall on private photos (not reported).","Matching accuracy with oracle masks (not reported).","Segmentation quality with oracle boxes (not reported).","Whether stages interact so that oracle gains cannot be added (our interpretation)."],"approach":"Measure candidate recall for each candidate source. Then replace one stage at a time with ground truth (candidate, label or selection, box to mask) and report headroom. Keep the other stages verified","tf":"Not verified","experiments":["Attribution to support pixels (details not read)."],"datasets":"Not verified","baselines":"Not verified","conditions":"Not verified","metrics":"Not verified","ablations":"Not verified","results":"Not verified","limitsAck":"Not verified","notAddressed":"Private categories; VLM pipelines (per abstract) (not verified).","interpretation":"HIGH overlap with RQ1/RQ2: asks how much the support is used. Must be read in full before any claim.","coverage":[["Unclear","Abstract only."],["Unclear","Abstract only."],["Unclear",""],["Unclear",""]],"ideas":["I1","I2"],"models":"DINOv2 / SAM-style matching pipelines (from the abstract only)."},{"id":"sam3","short":"SAM 3","tier":"related","title":"SAM 3: Segment Anything with Concepts (arXiv:2511.16719)","authors":"Not verified (the paper was not checked)","year":"arXiv 2025 (from the arXiv number)","venue":"arXiv preprint","problem":"Promptable concept segmentation with text and exemplars.","method":"Trained model with a presence token.","contribution":"A trained promptable concept segmentation model and benchmarks (not verified).","inputs":"Text, exemplars.","usesSupport":"Exemplars","usesNames":"Yes","tf":"Trained model (not verified)","experiments":["Presence token ablation; exemplar-only prompts are ambiguous (table number not verified)."],"datasets":"Large benchmarks (not verified).","baselines":"Not verified","conditions":"Text, exemplars.","metrics":"AP and others.","ablations":"Yes.","results":"Presence token multiplies the object score (not verified).","limitsAck":"Not verified","notAddressed":"Private categories with 16 fixed names.","interpretation":"Basis of SAM3-FSS and Agent2Seg; relevant to absent-target handling.","coverage":[["Partially evaluated","Text versus exemplar prompts."],["Not evaluated in the reported experiments",""],["Partially evaluated","Presence token."],["Not evaluated in the reported experiments",""]],"ideas":["I1","I5"],"models":"SAM 3, a trained model with a presence token (not verified)."},{"id":"matcher","short":"Matcher","tier":"related","title":"Matcher: Segment Anything with One Shot Using All-Purpose Feature Matching (arXiv:2305.13310)","authors":"Not verified (the paper was not checked)","year":"arXiv 2023 (from the arXiv number)","venue":"arXiv preprint","problem":"One-shot segmentation by feature matching.","method":"DINOv2 matching plus SAM.","contribution":"Described as a training-free one-shot pipeline (not verified).","inputs":"Reference image and mask.","usesSupport":"Yes","usesNames":"No (not verified)","tf":"Not verified","experiments":["Only method and implementation passages were seen; no support-swap test found (not verified)."],"datasets":"Not verified","baselines":"Not verified","conditions":"Not verified","metrics":"Not verified","ablations":"Not verified","results":"Not verified","limitsAck":"Instance-level matching limits (not verified).","notAddressed":"Support-swap tests (not found).","interpretation":"Close in design to NTT.","coverage":[["Unclear",""],["Unclear","No support-swap test found in passages read."],["Not evaluated in the reported experiments",""],["Not evaluated in the reported experiments",""]],"ideas":["I2","I4"],"models":"DINOv2 features with SAM (not verified)."},{"id":"sp","short":"SituationalPriv","tier":"related","title":"SituationalPriv: A Context-Aware Framework for Privacy Detection and Protection in Vision-Language Models","authors":"Not stated: the PDF is an anonymous submission (\"Anonymous Author(s)\").","year":"Not stated in the PDF (it cites 2025 work)","venue":"OpenReview submission PDF (no venue named in the file)","problem":"Privacy depends on context: the same object can be a leak in one sharing situation and fine in another. The authors say existing privacy benchmarks are static, and ask how well vision-language models (VLMs) detect privacy leakage in a given context.","method":"Two parts. (1) A benchmark, SituationalPriv: 440 DIPA2 images, each turned into two scenarios (sender, recipient, context), one privacy-sensitive and one not. (2) A training-free LLM-guidance framework: the Recognize Anything Model (RAM) lists the objects in the image as tags; an LLM (Q-LLM) picks potentially sensitive objects from the tags given the context and writes questions; a VLM answers the questions from the image; a second LLM (D-LLM) reads the answers and the context and decides whether a leak occurs.","contribution":"The benchmark, and a training-free LLM-VLM framework that the authors report improves context-aware privacy detection over their VLM-only baseline.","inputs":"An image plus a scenario (data sender, data recipient, context). The output is a yes/no decision on privacy leakage for the whole image. No masks or boxes.","usesSupport":"No. There are no support images.","usesNames":"No category list. The context text and the object tags from RAM drive the process.","tf":"The authors call the framework training-free and use pretrained models (RAM, LLaVA, GPT-4o). It relies on paid GPT-4o and GPT-4o mini, so it is not resource-free.","experiments":["Baseline: a VLM alone (LLaVA-1.5 13B) is asked, for each image, whether sharing it in the given scenario leaks privacy, in both the sensitive and the non-sensitive scenario (Section 4.1).","Baseline: an LLM alone (GPT-4o), listed without a VLM (Table 1). The text does not say what image information it receives.","LLM-guidance framework with different models: VLM LLaVA-1.5 13B, LLaVA-1.6 7B or GPT-4o; Q-LLM and D-LLM each GPT-4o or GPT-4o mini; 7 combinations in total (Table 1).","Analysis of recall versus precision, and of the role of the D-LLM (Section 4.2)."],"datasets":"SituationalPriv, built by the authors: 440 images from the DIPA2 dataset, each with two scenarios (440 x 2). How the contexts were generated and checked is not described in the text we extracted.","baselines":"VLM-only (LLaVA-1.5 13B) and LLM-only (GPT-4o).","conditions":"Paired sensitive and non-sensitive scenario for each image. No condition removes, corrupts or swaps the image or the context.","metrics":"Recall (share of sensitive cases found), Precision, F1; Accuracy also appears in Table 1. All are image-level yes/no, not localization.","ablations":"No separate ablation section. Table 1 varies the VLM, Q-LLM and D-LLM, which acts as a component comparison.","results":"Table 1. Best framework row (LLaVA-1.5 13B, Q-LLM GPT-4o, D-LLM GPT-4o): recall 77.73, precision 60.21, F1 67.86, accuracy 63.18. VLM-only (LLaVA-1.5 13B): recall 13.18, precision 93.55, F1 23.11, accuracy 56.14. LLM-only (GPT-4o): recall 62.87, precision 68.49, F1 65.56, accuracy 67.01. The paper says the framework significantly outperforms both baselines; in Table 1 only the best row has a higher F1 than the LLM-only baseline, and its accuracy is lower than LLM-only.","limitsAck":"Not reported: the text we read has no limitations section. Our observations, not the authors' statements: (1) the abstract claims generalization across open-domain datasets, but the text reports results on SituationalPriv only; (2) 6 of the 7 framework rows score lower F1 than the LLM-only baseline; (3) it depends on paid GPT-4o; (4) no confidence intervals or human check of the generated scenarios are described; (5) the file is an anonymous submission and may differ from a final version.","notAddressed":"Localization or segmentation, support images, private objects in blind or low-vision photos, how much each input contributes when it is removed or corrupted, and failure attribution.","interpretation":"Related work, not a baseline for our experiments: it is an image-level privacy classifier, not a few-shot segmentation method. Its value for us is the idea that privacy depends on context, and the observation that its LLM-only baseline (no VLM listed) scored close to the whole pipeline. We cannot say how much of that comes from text, because the inputs of that baseline are not described.","coverage":[["Partially evaluated","Compares VLM-only, LLM-only and combined systems, but for image-level privacy classification; what the LLM-only baseline sees is not stated."],["Not evaluated in the reported experiments","No support images; visual evidence is only a VLM answering text questions."],["Unclear","An LLM picks objects from RAM tags and judges VLM answers, but there are no mask candidates and no distractor test."],["Unclear","Swapping VLM and LLMs shows component effects, but no failure attribution."]],"ideas":["I1","I3"],"models":"Recognize Anything Model (RAM) for tags; VLM LLaVA-1.5 13B, LLaVA-1.6 7B or GPT-4o; Q-LLM and D-LLM: GPT-4o or GPT-4o mini. Figure 1 also shows a RAM-Grounded-SAM component and a prompt asking for suggestions to prevent a breach; the body text we extracted does not describe or evaluate them."},{"id":"multipriv","short":"MultiPriv","tier":"related","title":"MultiPriv: Benchmarking Individual-Level Privacy Reasoning in Vision-Language Models","authors":"Xiongtao Sun, Hui Li, Jiaming Zhang, Yujie Yang, Kaili Liu, Ruxin Feng, Wen Jun Tan, Wei Yang Bryan Lim (checked against the PDF)","year":"2025 (arXiv v1, 21 Nov 2025); v3 dated 29 May 2026","venue":"arXiv:2511.16940; Proceedings of the 43rd International Conference on Machine Learning (ICML 2026), PMLR 306, as printed in the PDF","problem":"Existing privacy benchmarks for vision-language models (VLMs) mostly test privacy perception, meaning spotting sensitive items. The authors argue the larger risk is privacy reasoning: a VLM linking scattered information to one identifiable person (Abstract; Section 1).","method":"A benchmark, not a model. They define Privacy Perception and Reasoning (PPR) (Section 3.2) and build a bilingual (Chinese and English) image dataset covering 36 privacy attributes in 7 categories (Section 3.3, Figure 3). It has nine visual question-answering tasks: four perception tasks (direct identifier recognition, indirect identifier recognition, privacy information extraction, privacy region localization) and five reasoning tasks (single-step cross-validation, single-step reasoning, chained reasoning, re-identification and linkability, cross-modal association) (Section 3.4, Figure 2). Models are evaluated as given, with the original prompts, no chain-of-thought instruction and temperature 0 (Section 4.1).","contribution":"The PPR framework, the MultiPriv benchmark, and an evaluation of over 50 VLMs reported to show that reasoning, more than perception, drives individual-level privacy risk (Section 1 contributions; Section 6).","inputs":"An image or several images plus a natural-language question. The model answers in text or, for the localization task, gives bounding-box coordinates (Section 3.4; Figures 2 and 11).","usesSupport":"No support images. Some tasks give several images, for example to link one person across images.","usesNames":"No category list. Questions name the kind of information in words.","tf":"Not applicable: it evaluates existing VLMs and proposes no method.","models":"Evaluated, not proposed: 5 commercial models (Gemini 2.5 Flash and Pro, Claude Sonnet 4, GPT-5, GPT-4o), 30 foundation VLMs and 18 reasoning VLMs (Section 1; Section 4.1), including Qwen3-VL, Llama-4, InternVL3.5, LLaVA and MiniCPM-V. Qwen2.5-72B-Instruct judges the 7% of samples that need semantic checking (Appendix E). Doubao and other tools generated synthetic images (Appendix B).","datasets":"1,119 attribute-level images from public sources plus synthesized ones (Section 3.3); 40 synthetic individuals with 10 images each (400 images) and a JSON profile (Sections 1 and 3.3; Impact Statement); 7,414 manually designed question-answer pairs (Figure 2 caption). About 80% of attribute-level images come from public datasets that allow research use and about 18% were generated with Doubao (Impact Statement; Appendix B). Source datasets and licences are listed in Appendix A (for example WIDER FACE, CC BY-NC-ND 4.0).","baselines":"No baseline method. The models under test are the subjects of the evaluation.","conditions":"English and Chinese versions of each task; original prompts versus step-by-step and chain-of-thought prompts (Table 7).","experiments":["Main evaluation of over 50 VLMs on the perception and reasoning tasks in English and Chinese (Tables 3 and 4; Section 4.2).","Reasoning effort: Qwen3-VL, GPT-5 and Claude Sonnet 4 under different reasoning settings (Table 5; Section 4.3).","Refusal analysis: refusal rates of GPT-5 settings (Table 6) and per-task refusal tables (Tables 13 to 15, Appendix I).","Prompt effect: original, step-by-step and structured chain-of-thought prompts (Table 7; Section 4.3).","Capability versus refusal: overall accuracy against answered-only accuracy (Table 8; Section 4.3).","Reliability of the answer checking: agreement with human annotations, Cohen's kappa 0.96 for information extraction, 0.92 for chained reasoning accuracy and 0.84 for chained reasoning steps (Appendix E)."],"metrics":"Recognition: F1. Extraction: exact-match information extraction accuracy (IEA). Localization: mean IoU between predicted and ground-truth bounding boxes, with a missing prediction scored 0. Reasoning: accuracy, completion percentage and task-completion accuracy. Higher means more privacy risk, and refusals count as failures (Section 3.5; Appendix H).","ablations":"No ablation of a method. The comparisons are across models, reasoning effort (Table 5) and prompts (Table 7).","results":"Section 4.2 text: QvQ-72B-Preview perception 0.454 and reasoning 0.632; Gemini-2.5-Flash perception 0.466 and reasoning 0.825; Qwen3-VL-32B-Thinking reasoning 0.874 (chained 0.878, cross-modal association 0.963). Bounding IoU is low: Table 3 (checked on the rendered table) gives 0.52 for Gemini-2.5-Pro, 0.44 Gemini-2.5-Flash, 0.41 GPT-5, 0.22 Claude-Sonnet-4, 0.20 GPT-4o; among open-source models 0.42 Llama-4-Maverick (best), 0.33 Qwen3-VL-8B, 0.22 QvQ-72B-Preview, and 0.00 for nine models (MiniCPM-V-4.5, DeepSeek-VL2 small and tiny, LLaVA-v1.6 Vicuna-7B and Mistral-7B, InstructBLIP flan-t5-xl, flan-t5-xxl, vicuna-7b and vicuna-13b). Abstract: in this controlled benchmark 60% of widely used VLMs reach up to 80% accuracy on individual-level reasoning. Section 4.3: GPT-5-high refused 68.86% of English tasks (GPT-5-low 35.44%). Section 4.3 and Table 8: GPT-5 overall reasoning accuracy 0.46 against 0.91 on answered questions only.","limitsAck":"Section 5: the data are synthetic, so real scenarios may be noisier and less complete; the threat model covers visual and cross-modal identity linkage only, leaving out text-only leakage, database retrieval, long interactions and agents. Our observations, not the authors' claims: (1) Section 3.5 says mIoU is reported separately from the aggregate perception score, while Appendix H.1 says the overall perception score includes localization; (2) the public repository files we checked do not contain the paper's question set or box annotations (see the resource entry below); (3) refusals count as failures, so the main tables mix capability and safety behaviour, although Table 8 separates them for some models; (4) Table 3 has 30 model rows (25 open-source, 5 commercial) while Section 1 counts 53 models, and we did not reconcile the two (not verified).","notAddressed":"Segmentation masks, few-shot or support-image methods, photographs taken by blind or low-vision users, private objects such as bank statements or prescriptions as localization targets, and failure attribution across pipeline stages.","interpretation":"Related work and a resource reference, not a baseline and not a segmentation method: it measures what VLMs can infer about people, not where private objects are. Overlaps with our work are limited to three reported facts: VLM-predicted bounding boxes had low IoU, some commercial VLMs refused many privacy tasks, and the authors separate refusal from capability (Table 8). Whether any of this applies to our images is untested.","coverage":[["Not evaluated in the reported experiments","No support images and no category-name versus visual-evidence comparison."],["Not evaluated in the reported experiments","Only a bounding-box task for text regions such as licence plates and card numbers; no support-image grounding."],["Not evaluated in the reported experiments","Its cross-validation task asks whether two images show the same person; there are no candidate masks and no distractor test."],["Partially evaluated","Separates refusal from capability (Table 8) and perception from reasoning, but for privacy question answering, not for stages of a segmentation pipeline."]],"ideas":["I3"],"resource":"multipriv-pii"}],"decisions":[["What does \"visual-only\" mean?","Decide which pipelines are in scope.","Some pipelines (VLM-Guided, Agent2Seg) also use a language model, category names or text reading (OCR). If \"visual-only\" rules them out, the papers we study change.","Supervisor"],["Is the wording of the question and RQ1 to RQ4 approved?","Confirm or change the wording.","The wording is marked as proposed only.","Supervisor"],["Which ideas to keep","Choose which ideas to select, reject or postpone.","All ideas are candidates. We cannot work on all of them.","You and supervisor"],["Can the project be analysis-first?","Decide whether a careful study of existing pipelines is enough, or a new method is required.","It decides how much we must build.","Supervisor"],["Images with no target (idea I5)","Decide whether this belongs under RQ3 or is a separate topic.","It changes how ideas are grouped and scored.","Supervisor"],["Dataset size mismatch","Choose which counts to quote: the downloaded release (1,072 images, 932 objects) or the paper (1,028 images, 967 objects).","Every percentage depends on the totals, and the reason for the difference is unknown. One table in our own dataset summary, titled \"query images\", adds up to 916, which is really the object count; there are 1,056 query images.","You and supervisor"],["Scoring of images with no annotated target","Find out how the official evaluation treats the 196 query images that have no annotated object.","An unannotated image may still contain the object. The rule changes every score and idea I5.","Supervisor or dataset organisers"],["Which scores to quote","Quote the numbers from the papers: Agent2Seg 73.08 / 72.89 and VLM-Guided 65.27 / 63.82 (bounding-box / segmentation mAP). Earlier summaries gave 72.98 and 63.82.","The papers may use different test data, so the scores must not be ranked against each other.","You, by re-reading the PDFs"],["Which pipelines are truly training-free","Decide which pipelines form the core comparison.","Agent2Seg adapts SAM3 with LoRA (a small training step). VLM-Guided says it needs no fine-tuning, but its code settings look like fine-tuning (not checked).","You and supervisor, after checking the code"],["Use of public query labels","Ask whether the public labels may be used for analysis-only experiments.","It decides which experiments we are allowed to run.","Supervisor or dataset contact"],["Access to the images","Get approval to download the support images, and the query images (about 1 GB) or use a temporary Kaggle or Colab session.","No experiment can start without images.","You"],["Real hardware","Measure the GPU and RAM we actually have, and test whether Qwen3-VL-8B runs when quantized (a smaller version of the model).","It decides which pipelines we can run.","You, by measurement"],["Shallow literature search","Read the unread papers in full, such as arXiv:2511.18163 and the MultiPriv-PII paper.","We cannot claim anything is new until this is done.","You"]],"cmp":{"ntt":{"tf":"Claimed (code not checked)","sup":"Yes (reference masks)","name":"No","data":"COCO-FSOD, PASCAL VOC, CD-FSOD","metric":"nAP","result":"36.8 nAP on COCO-FSOD (paper abstract)"},"vlgp":{"tf":"Claimed (settings not checked)","sup":"Yes","name":"Yes (required)","data":"COCO-20i, PASCAL-5i, cross-domain","metric":"mIoU","result":"Beats prior training-free methods (abstract); exact values not extracted here"},"sam3fss":{"tf":"Claimed","sup":"Yes","name":"Optional","data":"PASCAL-5i, COCO-20i","metric":"mIoU","result":"COCO-20i 75.8, PASCAL-5i 81.2 with text plus support (its Table 5)"},"vlmg":{"tf":"Claimed (repository config not checked)","sup":"No","name":"Yes (VLM writes cues)","data":"BIV-Priv-Seg challenge (partition not stated)","metric":"bbox and segmentation mAP","result":"65.27 bbox / 63.82 seg mAP (its Table 1)"},"a2s":{"tf":"No: SAM3 is LoRA-adapted","sup":"Yes","name":"Yes (plus OCR)","data":"VizWiz challenge benchmark (partition not stated)","metric":"bbox and segmentation mAP, AP50","result":"73.08 bbox / 72.89 seg mAP (its Table 1)"},"biv":{"tf":"Not applicable (benchmark)","sup":"1 per category provided","name":"Yes","data":"BIV-Priv-Seg: 1,028 images, 967 instances (paper)","metric":"AP50 and others","result":"Not summarised here"},"unifss":{"tf":"No (trained)","sup":"Yes","name":"Class text","data":"Not verified","metric":"mIoU","result":"Class text +8.2% relative mIoU in 1-shot (not verified)"},"bvc":{"tf":"No (trained)","sup":"Yes","name":"General semantics","data":"VOC, COCO (not verified)","metric":"mIoU","result":"Removing support: -0.7 (VOC), +0.9 (COCO) mIoU (not verified)"},"llafs":{"tf":"No (trained)","sup":"Yes","name":"Uses a language model","data":"Not verified","metric":"mIoU","result":"Removing support: -17.3 mIoU (not verified)"},"mbis":{"tf":"Not verified","sup":"Not verified","name":"Not verified","data":"Not verified","metric":"Not verified","result":"Abstract only; not reviewed"},"sam3":{"tf":"No (trained model)","sup":"Text or exemplars","name":"Yes","data":"Not verified","metric":"AP and others","result":"Not summarised here"},"matcher":{"tf":"Not verified","sup":"Yes (one reference)","name":"No","data":"Not verified","metric":"Not verified","result":"Not verified"},"sp":{"tf":"Claimed training-free (uses paid GPT-4o)","sup":"No","name":"No category list; context text plus RAM object tags","data":"SituationalPriv: 440 DIPA2 images x 2 scenarios","metric":"Recall, Precision, F1 (image-level yes/no, not localization)","result":"Best framework row: F1 67.86; LLM-only F1 65.56; VLM-only F1 23.11 (its Table 1)"},"multipriv":{"tf":"Not applicable (benchmark of existing VLMs)","sup":"No","name":"No category list; natural-language questions","data":"1,119 attribute-level images; 40 synthetic profiles (400 images); 7,414 question-answer pairs","metric":"F1, exact-match accuracy, bounding-box mIoU, task accuracy","result":"Qwen3-VL-32B-Thinking reasoning 0.874; bounding IoU 0.22 (QvQ-72B-Preview) to 0.52 (Gemini-2.5-Pro) (Section 4.2)"}},"goalSeed":"Can we design a more effective and practical method for localizing and segmenting privacy-sensitive objects using limited visual examples, while reducing the need for model training?","centralQ":"Do training-free private-object segmentation pipelines genuinely exploit few-shot visual evidence, or do they primarily rely on pretrained semantic knowledge?","resources":[{"id":"multipriv-pii","name":"MultiPriv-PII (GitHub repository)","url":"https://github.com/CyberChangAn/MultiPriv-PII","paper":"multipriv","rows":[["Type","Dataset and resource repository that accompanies the MultiPriv paper. It is not a segmentation method and not a baseline."],["Linked paper","MultiPriv: Benchmarking Individual-Level Privacy Reasoning in Vision-Language Models (arXiv:2511.16940). The repository README cites the paper and says it was accepted to ICML 2026."],["Checked","README, LICENSE, the full file list (GitHub interface), one person profile file and the structure of the spreadsheet were read on 2026-11-17. The same day we also checked the commit history, older README versions, the second branch, a Hugging Face copy and the file list of a related repository (see below). Nothing was cloned or run, and no images or the large text files were downloaded."],["Contents found","LLM: 4 JSON text files (personal records and prompts, English and Chinese; described in the README, not opened). VLM/attribute-level: 353 JPG images in subfolders A, B, C, D, E, F and H, plus Non_public_data_URL.xlsx (columns Number, link, Category; source links for images that are not stored). VLM/individual-level: 30 folders person_1 to person_30, each with 10 PNG images and one JSON text profile. Mobile-Agent: 10 platform folders with one PNG each."],["Annotations","No bounding boxes, masks or annotation files were found in the file list. The person JSON files are text profiles (name, ID number, address and similar fields), not image annotations. The README says images carry \"entities\" and a language field, but its example is an external picture that was not read."],["Count differences","Paper: 1,119 attribute-level images and 40 synthetic individuals (Section 3.3). README statistics: 405 images per language and 5,000 text samples per language. Repository files: 353 stored attribute-level images and 30 person folders. The spreadsheet adds 362 linked images, so 353 + 362 = 715 attribute-level images are accounted for (numbered contiguously in folders A to F and H). The README figure of 405 is the same in every README version checked, from August 2025 (before the paper), so it was never updated. 715 is neither 1,119 nor 810 (2 x 405). Whether the figures describe different subsets, languages or versions could NOT be established: unresolved."],["Missing pieces","The paper's 7,414 question-answer pairs, its box annotations and its evaluation scripts were not found in: the repository, its second branch (same files), the Hugging Face dataset CyberChangAn/MultiPriv (same 702 files, found by search), or the paper and arXiv page (the only resource link is the GitHub repository). The same authors' IDUnlearn-Bench repository is a different benchmark (60 synthetic individuals, own question files; its paper was not read). In one file pair inspected there, the \"_mask\" image was a redacted copy of a document (black box over a field), not a segmentation mask. So these items are not available through any linked resource found; the authors may hold or release them elsewhere (not verified)."],["Licence","The LICENSE file and README give CC BY-NC-SA 4.0 (non-commercial); GitHub itself lists the licence as \"Other\". The paper's Appendix A says many images come from other datasets with their own licences, some non-commercial or \"All Rights Reserved\". The README says some attribute-level images cannot be published in the repository."],["Activity","Created 2025-07-30, last push 2026-10-02 (GitHub interface). The README says the dataset will be updated after ongoing work is finished."],["Use for our segmentation experiments","Not suitable as ground truth for private-object segmentation: no masks and no boxes were found, the categories are personal information (faces, ID documents, medical and financial records) rather than our 16 object categories, and the images are not photographs taken by blind or low-vision users. Using it only as out-of-domain test images for VLM behaviour is a hypothesis, untested."]]}]}</script>
<script>(function(){
'use strict';
var D=JSON.parse(document.getElementById('app-data').textContent);
var CFG=window.HUB_CONFIG||{};
var K='498r.hub.v2.';
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var TAGW={P:'from the paper',F:'from a figure or table',D:'counted in the data files',R:'from the code repository',I:'our interpretation',H:'hypothesis',U:'not reported',V:'not verified',W:'abstract or web page only'};
function fmt(s){s=String(s==null?'':s);if(/^\s*\[(U|V)\]\s*$/.test(s))return '<span class="muted">Not reported / not verified</span>';
  return esc(s).replace(/\[(P|D|R|I|H|U|V|F|W)([:,][^\]]*)?\]/g,function(m,a,b){var extra=b?b.replace(/^[:,]\s*/,''):'';return '<span class="lab">('+TAGW[a]+(extra?': '+extra:'')+')</span>'})}
var store={get:function(k,d){try{var v=localStorage.getItem(K+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}}};
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function download(name,text){var b=new Blob([text],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},300)}
function safeUrl(u){u=String(u||'').trim();return /^https:\/\/[^\s"<>]+$/.test(u)?u:''}

var STATUS=['Under consideration','Literature review','Proposed','Selected','Experimenting','Rejected'];
var RQS=['RQ1','RQ2','RQ3','RQ4'];
var RQNAME={RQ1:'Semantic Dependence',RQ2:'Visual Grounding',RQ3:'Candidate Verification',RQ4:'Failure Attribution'};
var RQTXT={RQ1:'How much do pipelines rely on category names or text rather than support-image visual information?',RQ2:'Can visual support examples resolve ambiguity when labels are insufficient, ambiguous or misleading?',RQ3:'How well can VLM-based verification separate targets from visually or semantically similar distractors?',RQ4:'At which stage do pipelines fail: candidates, visual correspondence, semantic classification or segmentation?'};

/* ---------- goal with history ---------- */
function getGoal(){return store.get('goal',{cur:{text:D.goalSeed,date:'',seed:true},hist:[]})}
function saveGoal(text){
  var g=getGoal();text=text.trim();if(!text||text===g.cur.text)return false;
  g.hist.unshift({text:g.cur.text,date:g.cur.date,seed:!!g.cur.seed,until:today()});
  g.cur={text:text,date:today(),seed:false};store.set('goal',g);return true;
}
/* ---------- focus ---------- */
var FF=[['focus','Current Focus','Which RQ or research idea are we investigating right now?'],['target','Immediate Target','What is the next concrete task?'],['milestone','Next Milestone','What do we want to achieve next?']];

function allIdeas(){return D.ideas.filter(function(r){return S.del.indexOf(r.id)<0}).map(function(r){return S.ov[r.id]||r}).concat(S.custom)}
function getIdea(id){return allIdeas().filter(function(r){return r.id===id})[0]}
function putIdea(r){if(S.custom.some(function(c){return c.id===r.id}))S.custom=S.custom.map(function(c){return c.id===r.id?r:c});else S.ov[r.id]=r;saveIdeas()}
function isBuiltin(id){return D.ideas.some(function(r){return r.id===id})}

var IF=[['title','Idea title','text'],['rq','Research question','rq'],['status','Status','status'],
 ['ideaText','A. The proposed idea','area'],['problem','A. The problem we want to solve','area'],['why','B. Motivation: why explore this','area'],
 ['papers','C. Relevant papers (one per line)','list'],['prevExp','C. Experiments previous researchers conducted (one per line)','list'],['prevMetrics','C. Evaluation methods and metrics they used','area'],['established','C. Their findings, where reported (one per line)','list'],
 ['uncertain','D. What previous work has not addressed or left uncertain (one per line)','list'],['gapNote','D. What we could investigate differently','area'],
 ['approach','E. Proposed approach: what we want to do and the main steps','area'],
 ['implNotes','F. Your own implementation notes (models, tools, datasets, steps)','area'],
 ['evaluation','G. Evaluation: datasets, baselines, metrics, experiments','area'],['outcomes','G. Results that would support or challenge the hypothesis (one per line)','list'],['risks','Risks and limitations (one per line)','list']];

/* ---------- html helpers ---------- */

function covList(p){return '<ul>'+(p.coverage||[]).map(function(c,i){return '<li><b>'+RQS[i]+'</b>: '+esc(c[0])+'. <span class="muted">'+fmt(c[1])+'</span></li>'}).join('')+'</ul>'}

/* ---------- Overview ---------- */
function overview(){
  var g=getGoal(),f=getFocus();
  var hist=g.hist.map(function(h){var t=h.text,short=t.length>90?t.slice(0,87)+'...':t;
    return '<details class="old"><summary><s>'+esc(short)+'</s> <span class="muted small">'+(h.seed?'starting text, ':'')+(h.date?'set '+esc(h.date)+', ':'')+'replaced '+esc(h.until)+'</span></summary><p>'+esc(t)+'</p></details>'}).join('');
  var fr=FF.map(function(x){var v=(f[x[0]]||'').trim();return '<div class="frow"><div class="fl">'+x[1]+'</div><div class="fv'+(v?'':' ph')+'">'+(v?esc(v):(x[0]==='focus'?'No current focus selected yet. Set your current focus.':'Not set yet. Click Edit focus.'))+'</div></div>'}).join('');
  return '<section class="goal"><h2>Current Research Goal</h2><p class="goaltext" id="goalText">'+esc(g.cur.text)+'</p>'+
   '<p class="small muted">'+(g.cur.seed?'Proposed goal, not yet approved by the supervisor. Edit it to state your real goal; the old text is kept in the history. ':'Active goal, set '+esc(g.cur.date)+'. ')+'</p>'+
   '<div id="goalEdit" hidden><textarea id="goalInput" rows="4">'+esc(g.cur.text)+'</textarea><p class="small muted">Saving keeps the old goal in the history below. Nothing is deleted.</p><button class="primary" id="goalSave">Save new goal</button> <button id="goalCancel">Cancel</button></div>'+
   '<p><button id="goalBtn">Edit goal</button></p>'+
   '<h3>Goal history</h3><div id="goalHist">'+(hist||'<p class="muted small">No earlier goals yet. When you save a new goal, the previous one appears here.</p>')+'</div></section>'+
  '<section class="rqs"><h2>Research Questions</h2><p class="small muted">Proposed wording, not yet approved by the supervisor. Each question has candidate ideas on the <a href="#ideas">Research Ideas</a> page.</p>'+
  '<p><b>Central question.</b> '+esc(D.centralQ||'')+'</p>'+
  '<ul class="rqlist">'+RQS.map(function(q){return '<li><b>'+q+' '+RQNAME[q]+'.</b> '+RQTXT[q]+'</li>'}).join('')+'</ul></section>'+
  '<section><h2>Current Focus</h2><div id="focusView">'+fr+'<p><button id="focusBtn">Edit focus</button></p></div>'+
   '<div id="focusEdit" hidden>'+FF.map(function(x){return '<div class="fld"><label>'+x[1]+'</label><span class="small muted">'+x[2]+'</span><textarea data-f="'+x[0]+'" rows="2">'+esc(f[x[0]]||'')+'</textarea></div>'}).join('')+'<button class="primary" id="focusSave">Save</button> <button id="focusCancel">Cancel</button></div></section>'+
  '<section class="openq"><h2>Open research questions</h2><p class="small muted">Undecided. They are listed so they are not forgotten. Nothing here is an approved decision, and no supervisor approval is recorded for the goal or the research questions above.</p>'+
  '<ol class="openlist">'+
  '<li><b>What exactly qualifies as training-free?</b> A frozen backbone is not enough if another part is trained. For example, the Agent2Seg paper says its SAM3 model is LoRA-adapted, and VLM-Guided says it needs no fine-tuning (its code was not inspected). We have not fixed a definition.</li>'+
  '<li><b>How many visual support examples count as few-shot?</b> The official BIV-Priv-Seg setting gives one support image per category (16 in total). Whether one example is enough for our claims, or whether we also test more, is undecided.</li>'+
  '<li><b>Are OCR, text prompts and semantic reasoning within scope?</b> Our brief says the scope is visual-only pipelines, so it is not settled what that means for pipelines that use a vision-language model (VLM), text prompts or category names, or OCR (reading text in the image). For example, VLM-Guided Detection and Rematching for Private Object Localization uses a VLM and text prompts and no support images, and Agent2Seg uses support images, category names, OCR and a VLM. Whether such pipelines are in scope is undecided; it needs confirmation from the supervisor.</li>'+
  '<li><b>Which datasets provide actual segmentation masks?</b> BIV-Priv-Seg has instance segmentations (the paper reports 967). We have not checked other candidate datasets for private-object masks. In the MultiPriv-PII repository we found no masks and no boxes (see Previous Research).</li>'+
  '<li><b>How should localization, segmentation, verification and efficiency be evaluated?</b> The challenge papers report bounding-box and segmentation mAP. How to score verification (RQ3) and how to measure efficiency (runtime, memory) are not decided, and efficiency should be reported separately from accuracy.</li>'+
  '<li><b>Which BIV-Priv-Seg counts should we cite?</b> The BIV-Priv-Seg paper reports 1,028 images and 967 instance segmentations. The released files we downloaded and counted contain 1,072 images (16 support and 1,056 query) and 932 instances. We do not know the reason for the difference and have not decided which counts to cite; every rate depends on the totals.</li>'+
  '</ol></section>'+
  '<p class="muted small">Edits and goal history are saved only in this browser. They are not shared with teammates.</p>'+
  '<details class="backup"><summary class="small">Backup of my edits (this browser only)</summary><p><button id="expAll">Export my edits</button> <label class="small">Import: <input type="file" id="impAll" accept=".json"></label> <button id="resetAll">Delete all my edits</button></p><p class="small muted">Export saves the goal and its history, the focus fields, idea edits, added ideas and statuses to a file. Import restores them, in this or another browser.</p></details>'+
  '<p><a href="#ideas">Go to the four research questions and their ideas &rarr;</a></p>';
}

/* ---------- Research Ideas ---------- */
function ideasPage(){
  var ideas=allIdeas();
  var out='<h2>Research Questions and Ideas</h2><p class="muted">Ideas are candidates for discussion. None is approved, and none is confirmed novel. The RQ wording is proposed; supervisor approval is not confirmed. The scope is visual-only pipelines; what that excludes still needs confirming.</p>';
  RQS.forEach(function(q){
    var rs=ideas.filter(function(i){return i.rq===q});
    out+='<section class="rq"><h3>'+q+' '+RQNAME[q]+'</h3><p class="muted">'+RQTXT[q]+'</p><ul class="ideas">'+
     (rs.map(function(i){return '<li><a href="#idea/'+esc(i.id)+'">'+esc(i.title)+'</a> <span class="st">'+esc(i.status)+'</span><br><span class="small muted">'+fmt(i.ideaText||'')+'</span></li>'}).join('')||'<li class="muted">No ideas yet.</li>')+
     '</ul><button class="addIdea" data-rq="'+q+'">Add an idea under '+q+'</button></section>'});
  return out;
}
function ideaPage(id){
  var r=getIdea(id);if(!r)return '<p>Idea not found. <a href="#ideas">Back</a></p>';
  var plans=r.plans||[],prev=r.prevImpl||[];
  var linked=D.papers.filter(function(p){return (p.ideas||[]).indexOf(id)>-1});
  var A='<h3>A. Idea</h3><p><b>Proposed idea.</b> '+fmt(r.ideaText||'')+'</p><p><b>Problem.</b> '+fmt(r.problem||'')+'</p>';
  var B='<h3>B. Motivation</h3>'+para(r.why);
  var C='<h3>C. Previous research</h3><h4>Relevant papers</h4>'+ul(r.papers)+(linked.length?'<p class="small">Details in Previous Research: '+linked.map(function(p){return '<a href="#paper/'+esc(p.id)+'">'+esc(p.short)+'</a>'}).join(', ')+'</p>':'')+
   '<h4>Experiments they conducted</h4>'+ul(r.prevExp)+'<h4>Evaluation methods and metrics</h4>'+para(r.prevMetrics)+'<h4>Findings, where reported</h4>'+ul(r.established);
  var Dd='<h3>D. Research gap and our difference</h3><h4>Not addressed or still uncertain in what we read</h4>'+ul(r.uncertain)+'<h4>What we could investigate differently</h4>'+para(r.gapNote)+'<p class="small muted">Novelty is not claimed: the literature search was shallow, so a gap here means "not found in what we read".</p>';
  var E='<h3>E. Proposed approach</h3>'+para(r.approach);
  var F='<h3>F. Implementation</h3><p class="small muted">Nothing below has been implemented or run by us. The step-by-step plans are our own proposals. They are fixed text and cannot be edited on this page; use "Edit this idea" and the implementation notes field to add your own, or edit <code>index.html</code>.</p>'+
   '<h4>Already implemented by previous authors (their pipeline, as described in their paper)</h4>'+(prev.length?'<ul>'+prev.map(function(p){return '<li><b><a href="#paper/'+esc(p.id)+'">'+esc(p.short)+'</a></b>: '+fmt(p.method)+' <span class="muted small">Training-free? '+fmt(p.tf)+'</span></li>'}).join('')+'</ul>':'<p class="muted">No linked pipeline paper.</p>')+
   '<h4>What we propose to implement (our plan, not yet implemented)</h4>'+(plans.length?plans.map(function(x){return '<details class="plan"><summary><b>'+esc(x.id)+'</b> '+esc(x.name)+' <span class="muted small">(proposed, not run)</span></summary><ol>'+x.method.map(function(s){return '<li>'+fmt(s)+'</li>'}).join('')+'</ol><p><b>Models and baselines.</b> '+fmt(x.models)+'</p><p><b>Data.</b> '+fmt(x.data)+'</p></details>'}).join(''):'<p class="muted">No plan written yet.</p>')+
   (r.implNotes?'<h4>Our own notes</h4>'+para(r.implNotes):'');
  var G='<h3>G. Evaluation</h3><p class="small muted">The overall evaluation text below is editable. The per-experiment details (hypothesis, metrics, limitations) are fixed text. Nothing has been run, so there are no results.</p>'+para(r.evaluation)+(plans.length?'<h4>Per experiment</h4>'+plans.map(function(x){return '<details class="plan"><summary><b>'+esc(x.id)+'</b> '+esc(x.name)+'</summary><p><b>Hypothesis (an expectation, not a result).</b> '+fmt(x.hypothesis)+'</p><p><b>Metrics.</b> '+fmt(x.metrics)+'</p><p><b>Limitations.</b> '+fmt(x.limitations)+'</p></details>'}).join(''):'')+
   '<h4>What would support or challenge the hypothesis</h4>'+ul(r.outcomes)+(r.risks&&r.risks.length?'<h4>Risks and limitations</h4>'+ul(r.risks):'');
  var H='<h3>H. Status</h3><p>'+select('id="ideaStatus"',STATUS,r.status)+'</p>';
  return '<p class="small"><a href="#ideas">&larr; All research questions</a></p><p class="small muted">'+esc(r.rq)+' '+esc(RQNAME[r.rq]||'')+'</p><h2>'+esc(r.title)+'</h2>'+
   '<p><button id="editIdea">Edit this idea</button> '+(isBuiltin(id)?'<button id="resetIdea">Restore original text</button>':'<button id="delIdea">Delete idea</button>')+'</p>'+A+B+C+Dd+E+F+G+H;
}
function ideaForm(rec,isNew){
  var h=IF.map(function(x){var k=x[0],t=x[2],v=rec[k];if(t==='list')v=(v||[]).join('\n');var inp;
    if(t==='text')inp='<input type="text" data-k="'+k+'" value="'+esc(v)+'">';
    else if(t==='rq')inp=select('data-k="'+k+'"',RQS,v);
    else if(t==='status')inp=select('data-k="'+k+'"',STATUS,v);
    else inp='<textarea data-k="'+k+'" rows="'+(t==='list'?4:3)+'">'+esc(v||'')+'</textarea>';
    return '<div class="fld"><label>'+esc(x[1])+'</label>'+inp+'</div>'}).join('');
  return '<h2>'+(isNew?'Add an idea':'Edit idea')+'</h2>'+h+'<p><button class="primary" id="saveIdea">Save</button> <button id="cancelIdea">Cancel</button></p><p class="small muted">Saved in this browser only.</p>';
}
function readIdea(base){var r=clone(base);$$('[data-k]').forEach(function(e){var k=e.getAttribute('data-k'),v=e.value;var d=IF.filter(function(x){return x[0]===k})[0];if(!d)return;if(d[2]==='list')v=v.split('\n').map(function(s){return s.trim()}).filter(Boolean);r[k]=v});return r}

/* ---------- Previous Research ---------- */
function covShort(c){return /^Fully/.test(c)?'Fully':/^Partially/.test(c)?'Partly':/^Not/.test(c)?'Not tested':'Unclear'}
function row2(l,v){return '<tr><th scope="row">'+l+'</th><td>'+v+'</td></tr>'}
function paperCard(p){
  var rel=(p.coverage||[]).map(function(c,i){return '<b>'+RQS[i]+' '+RQNAME[RQS[i]]+':</b> '+esc(c[0])+(c[1]?'. '+fmt(c[1]):'')}).join('<br>');
  var exps=p.experiments&&p.experiments.length?'<ul>'+p.experiments.map(function(x){return '<li>'+fmt(x)+'</li>'}).join('')+'</ul>':'Not reported';
  var ig=function(src,cap){return src?'<figure><img src="'+esc(src)+'" alt="'+esc(cap)+'"><figcaption>'+fmt(cap)+'</figcaption></figure>':''};
  return '<details class="paper" id="paper-'+esc(p.id)+'"><summary><b>'+esc(p.short)+'</b> <span class="muted small">'+esc(p.title)+'</span></summary><div class="tw"><table class="kv">'+
   row2('Paper title',esc(p.title))+row2('Authors',fmt(p.authors))+row2('Year / venue',fmt((p.year||'')+', '+(p.venue||'')))+
   row2('Research objective',fmt(p.problem))+row2('Proposed method',fmt(p.method))+row2('Models and components',fmt(p.models))+row2('Training-free?',fmt(p.tf))+
   row2('Dataset',fmt(p.datasets))+row2('Experiments conducted by the authors',exps)+row2('Evaluation metrics',fmt(p.metrics))+row2('Reported results',fmt(p.results))+
   row2('Limitations',fmt(p.limitsAck))+row2('Relevance to our RQs',rel)+row2('Our interpretation (not the authors\' claim)',fmt(p.interpretation))+
   '</table></div>'+(p.resource?'<p class="small">Accompanying repository: <a href="#resource/'+esc(p.resource)+'">'+esc(((D.resources||[]).filter(function(x){return x.id===p.resource})[0]||{}).name||p.resource)+'</a></p>':'')+'<p class="small">Linked ideas: '+(p.ideas||[]).map(function(i){return '<a href="#idea/'+i+'">'+i+'</a>'}).join(', ')+'</p>'+ig(p.paperFig,p.paperFigNote||'')+'</details>';
}
function resourceCard(r){
  var p=D.papers.filter(function(x){return x.id===r.paper})[0];
  var u=safeUrl(r.url);
  return '<details class="paper" id="res-'+esc(r.id)+'"><summary><b>'+esc(r.name)+'</b> <span class="muted small">dataset and resource, linked to '+esc(p?p.short:'its paper')+'</span></summary><div class="tw"><table class="kv">'+
   (u?row2('Address','<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a>'):'')+
   r.rows.map(function(x){return row2(esc(x[0]),fmt(x[1]))}).join('')+
   '</table></div>'+(p?'<p class="small">Paper: <a href="#paper/'+esc(p.id)+'">'+esc(p.title)+'</a></p>':'')+'</details>';
}
function related(){
  var cmp=D.papers.map(function(p){var c=D.cmp[p.id]||{};return '<tr><td><a href="#paper/'+esc(p.id)+'"><b>'+esc(p.short)+'</b></a></td><td>'+esc(c.tf||'Not verified')+'</td><td>'+esc(c.sup||'Not verified')+'</td><td>'+esc(c.name||'Not verified')+'</td><td>'+esc(c.data||'Not verified')+'</td><td>'+esc(c.metric||'Not verified')+'</td><td>'+esc(c.result||'Not reported')+'</td>'+(p.coverage||[]).map(function(x){return '<td>'+covShort(x[0])+'</td>'}).join('')+'</tr>'}).join('');
  var grp=function(t,tiers){return '<h3>'+t+'</h3>'+D.papers.filter(function(p){return tiers.indexOf(p.tier)>-1}).map(paperCard).join('')};
  return '<h2>Previous Research</h2><p class="muted">What earlier authors did. Everything here describes <b>other authors\' work</b>, not ours. We have run no experiments. Authors, titles and the headline numbers of the main papers were checked against their PDFs. Anything we have not checked is marked "Not verified"; "Not reported" means we did not find it. The RQ columns and the "Our interpretation" rows are our reading, not the authors\' claims.</p>'+
  '<h3>Comparison of the papers</h3><div class="tw"><table class="cmp"><thead><tr><th>Paper</th><th>Training-free?</th><th>Uses support images?</th><th>Uses class names or text?</th><th>Dataset</th><th>Metric</th><th>Reported result</th><th>RQ1</th><th>RQ2</th><th>RQ3</th><th>RQ4</th></tr></thead><tbody>'+cmp+'</tbody></table></div>'+
  '<p class="small muted">RQ columns show how much the authors\' reported experiments tested each question (our reading): Partly, Not tested, Unclear. No paper is rated "Fully". Results come from different datasets and protocols, so they must not be ranked against each other.</p>'+
  grp('Five core pipelines',['core'])+grp('Benchmark and other related work',['benchmark','related'])+
  '<h3>Datasets and resources</h3><p class="muted small">Data and code that accompany a paper. They are listed separately because a repository is not a method or a baseline.</p>'+(D.resources||[]).map(resourceCard).join('')+
  '<p class="small muted">The only figure shown is from a paper, and it is credited to that paper.</p>';
}

/* ---------- Team Progress ---------- */
function progress(){
  return '<h2>Team Progress</h2><p class="lead">Team progress tracking will be added when we begin collaborative experiments.</p>';
}

/* ---------- router ---------- */
var main=$('#view');
function strip(hide){var g=getGoal().cur.text,f=(getFocus().focus||'').trim(),e=$('#strip');e.hidden=!!hide;
  e.innerHTML='<div><b>Research goal:</b> '+esc(g)+'</div><div><b>Current focus:</b> '+(f?esc(f):'<a href="#overview">No current focus selected yet. Set your current focus.</a>')+'</div>'}
function route(){
  var h=(location.hash||'#overview').slice(1),p=h.split('/'),s=p[0],html,nav;
  if(s==='ideas'){html=ideasPage();nav='ideas'}else if(s==='idea'){html=ideaPage(p[1]);nav='ideas'}
  else if(s==='related'||s==='paper'||s==='resource'){html=related();nav='related'}else if(s==='progress'){html=progress();nav='progress'}
  else{html=overview();nav='overview';s='overview'}
  main.className=(s==='related'||s==='paper'||s==='resource'||s==='progress')?'wide':'';main.innerHTML=html;$$('nav a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-s')===nav)});strip(s==='overview');bind(s,p);
  if(s==='paper'){var el=document.getElementById('paper-'+p[1]);if(el){el.open=true;el.scrollIntoView()}}
  else if(s==='resource'){var er=document.getElementById('res-'+p[1]);if(er){er.open=true;er.scrollIntoView()}}else window.scrollTo(0,0);
}
function on(sel,fn){var e=$(sel);if(e)e.addEventListener('click',fn)}
function bind(s,p){
  if(s==='overview'){
    on('#goalBtn',function(){$('#goalEdit').hidden=false;$('#goalInput').focus()});on('#goalCancel',function(){route()});
    on('#goalSave',function(){var t=$('#goalInput').value.trim();if(!t){alert('The goal cannot be empty.');return}saveGoal(t);route()});
    on('#focusBtn',function(){$('#focusView').hidden=true;$('#focusEdit').hidden=false});on('#focusCancel',function(){route()});
    on('#focusSave',function(){var o={};$$('[data-f]').forEach(function(e){o[e.getAttribute('data-f')]=e.value.trim()});o.updated=today();store.set('focus',o);route()});
  }
  if(s==='ideas'){$$('.addIdea').forEach(function(b){b.addEventListener('click',function(){var id='C'+(Date.now()%100000);form({id:id,rq:b.getAttribute('data-rq'),status:'Under consideration',title:'',ideaText:'',problem:'',why:'',papers:[],prevExp:[],prevMetrics:'',established:[],uncertain:[],gapNote:'',approach:'',implNotes:'',evaluation:'',outcomes:[],risks:[]},true)})})}
  if(s==='idea'){var id=p[1];
    var st=$('#ideaStatus');if(st)st.addEventListener('change',function(){var r=clone(getIdea(id));r.status=this.value;putIdea(r)});
    on('#editIdea',function(){form(getIdea(id),false)});
    on('#resetIdea',function(){if(confirm('Restore the original text for this idea?')){delete S.ov[id];saveIdeas();route()}});
    on('#delIdea',function(){if(confirm('Delete this idea?')){S.custom=S.custom.filter(function(r){return r.id!==id});saveIdeas();location.hash='#ideas'}});}
  if(s==='paper'||s==='related'||s==='resource'){$$('figure img').forEach(function(i){i.addEventListener('click',function(){$('#lbimg').src=i.src;$('#lb').classList.add('on')})})}
  if(s==='overview'){
    on('#expAll',function(){var o={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf(K)===0)o[k]=localStorage.getItem(k)}download('498r_hub_edits_'+today()+'.json',JSON.stringify(o,null,1))});
    var im=$('#impAll');if(im)im.addEventListener('change',function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);Object.keys(o).forEach(function(k){if(k.indexOf(K)===0)localStorage.setItem(k,o[k])});location.reload()}catch(e){alert('Not a valid edits file.')}};r.readAsText(f)});
    on('#resetAll',function(){if(!confirm('Delete ALL your local edits, including the goal history? This cannot be undone. Export first if unsure.'))return;Object.keys(localStorage).forEach(function(k){if(k.indexOf(K)===0)localStorage.removeItem(k)});location.reload()});
  }
}
function form(rec,isNew){
  main.innerHTML=ideaForm(rec,isNew);window.scrollTo(0,0);
  on('#cancelIdea',function(){route()});
  on('#saveIdea',function(){var r=readIdea(rec);if(!r.title.trim()){alert('Please give the idea a title.');return}
    if(isNew){r.plans=[];r.prevImpl=[];S.custom.push(r);saveIdeas()}else putIdea(r);location.hash='#idea/'+r.id;route()});
}
// Basic deterrence against casual copying only. Not real protection: page source, dev tools and screenshots still work.
(function(){
  function editable(t){return !!(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"]'))}
  ['contextmenu','selectstart','copy','cut','dragstart'].forEach(function(n){
    document.addEventListener(n,function(e){if(!editable(e.target))e.preventDefault()});
  });
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&!e.altKey&&/^[cxa]$/i.test(e.key)&&!editable(e.target))e.preventDefault();
  });
})();
window.addEventListener('hashchange',route);
document.documentElement.setAttribute('data-theme',store.get('theme','light'));
$('#themeBtn').addEventListener('click',function(){var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);store.set('theme',n)});
$('#lb').addEventListener('click',function(){$('#lb').classList.remove('on')});
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('#lb').classList.remove('on')});
route();
})();
</script></body></html>
